# CRM stack. See docs/stacks.md.
services:
  typesense:
    image: typesense/typesense:28.0
    container_name: crm-typesense
    restart: always
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_ENABLE_CORS: "true"
    volumes:
      - crm-typesense:/data
    networks:
      - crm

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - crm-redis:/data
    networks:
      - crm
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ${PROVIDER_IMAGE}
    container_name: crm-provider
    mem_limit: 512m
    restart: always
    env_file: .env
    environment:
      APP_ROLE: app
    volumes:
      - crm-storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      typesense:
        condition: service_started
    networks:
      - crm
      - data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - autoheal=true

  worker:
    image: ${PROVIDER_IMAGE}
    container_name: crm-worker
    mem_limit: 512m
    restart: always
    env_file: .env
    environment:
      APP_ROLE: worker
    healthcheck:
      disable: true
    volumes:
      - crm-storage:/app/storage
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm
      - data
    labels:
      - com.centurylinklabs.watchtower.enable=true

  web:
    image: ${WEB_IMAGE}
    container_name: crm-web
    mem_limit: 512m
    restart: always
    environment:
      NODE_ENV: production
      DO_NOT_TRACK: "1"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      PROVIDER_INTERNAL_URL: http://app:8080
      PROVIDER_INTERNAL_API_URL: http://app:8080/api
    depends_on:
      app:
        condition: service_healthy
    networks:
      - crm
      - edge
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.crm-web.rule=Host(`${WEB_DOMAIN}`)
      - traefik.http.routers.crm-web.entrypoints=websecure
      - traefik.http.routers.crm-web.tls.certresolver=letsencrypt
      - traefik.http.services.crm-web.loadbalancer.server.port=3000

networks:
  crm:
    name: crm
    driver: bridge
  edge:
    name: edge
    external: true
  data:
    name: data
    external: true

volumes:
  crm-storage:
  crm-typesense:
  crm-redis:
