name: Checks

# Deploy lint: proves the deployer still holds together without touching a
# server. Nothing here connects to the host, logs in to a registry or reads a
# secret; every test runs against fakes and committed fake values
# (ci/sample-extra-vars.json).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-lint:
    name: Deploy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ansible-core python3-jinja2 python3-yaml jq

      - name: Ansible syntax check
        run: |
          ansible-playbook --syntax-check -i localhost, release.yml
          ansible-playbook --syntax-check -i inventory/hosts.example provision.yml

      - name: Placeholder credential guards
        run: bash ci/placeholder-guards.sh

      - name: No remote script piped into a shell
        run: |
          if grep -rnE '(curl|wget)[^|]*\|[[:space:]]*(sudo[[:space:]]+)?(ba|z|da)?sh\b' \
            roles tasks stack ci .github ./*.sh ./*.yml ansible.cfg; then
            echo "::error::download and verify the file instead of piping it into a shell"
            exit 1
          fi

      - name: Shellcheck
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  ${RUNNER_TEMP}/shellcheck.tar.xz" | sha256sum --check --strict
          tar -xJf "${RUNNER_TEMP}/shellcheck.tar.xz" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/shellcheck-v0.11.0/shellcheck" build-bundle.sh release-images.sh ci/*.sh \
            roles/common/files/infra-deploy-gate roles/common/files/infra-apply roles/host/files/infra-firewall roles/host/files/infra-backup \
            roles/ci_runners/files/ci-runners-firewall roles/ci_runners/files/ci-runner-setup roles/ci_runners/files/ci-runner-register

      - name: Install the Docker Compose the host runs
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/docker-compose" https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64
          echo "40343e21ca777173e69cff5dbafeb37c6f81f3b0d57d9e597f036e95eb63e76a  ${RUNNER_TEMP}/docker-compose" | sha256sum --check --strict
          # The user plugin directory wins over any compose the runner image ships.
          install -D -m 0755 "${RUNNER_TEMP}/docker-compose" "${HOME}/.docker/cli-plugins/docker-compose"
          test "$(docker compose version --short)" = 5.6.0

      - name: Release gate, release script and bundle build
        run: bash ci/release-scripts.sh

      - name: Rollback resolution
        run: bash ci/rollback-scripts.sh

      - name: Nightly backup script
        run: bash ci/backup-scripts.sh

      - name: Edge, Watchtower, autoheal, Docker, GPU and host verify tasks
        run: bash ci/verify-tasks.sh

      - name: Deploy templates
        run: python3 ci/check_templates.py --self-test

      - name: Deploy access
        run: python3 ci/check_access.py --self-test

      - name: Drive-style file list matches the pinned SFTPGo
        run: bash ci/files-ui.sh

      - name: Validate the edge, Watchtower and autoheal compose files
        run: |
          set -euo pipefail
          for role in edge watchtower autoheal beszel snowflake; do
            out="$(docker compose --file "roles/${role}/files/docker-compose.yml" config --quiet 2>&1)" || { echo "$out"; exit 1; }
            if grep -q 'variable is not set' <<<"$out"; then
              echo "$out"
              echo "::error::roles/${role}/files/docker-compose.yml interpolates a variable; role compose files take none"
              exit 1
            fi
            echo "ok   roles/${role}/files/docker-compose.yml"
          done

      - name: Validate the stack compose files against a bundle rendered from the sample vars
        run: |
          set -euo pipefail
          printf '%s\n' 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFakeChecksFakeChecksFakeChecksFakeChecks01 ci-checks' >"${RUNNER_TEMP}/deploy_key.pub"
          rm -rf "${RUNNER_TEMP}/bundle"
          ansible-playbook -i localhost, -c local release.yml -e @ci/sample-extra-vars.json \
            -e "deploy_key_file=${RUNNER_TEMP}/deploy_key.pub" -e "bundle_dir=${RUNNER_TEMP}/bundle" </dev/null >"${RUNNER_TEMP}/render.log" 2>&1 ||
            { cat "${RUNNER_TEMP}/render.log"; echo "::error::release.yml refused to render ci/sample-extra-vars.json"; exit 1; }
          # TAILSCALE_IP comes from /etc/infra/host.env on the host (infra-apply exports it).
          for stack in database portfolio hypernova tunnel ai media; do
            out="$(TAILSCALE_IP=100.64.0.7 docker compose --file "stack/${stack}/docker-compose.yml" --project-directory "${RUNNER_TEMP}/bundle/${stack}" config --quiet 2>&1)" ||
              { echo "$out"; exit 1; }
            if grep -q 'variable is not set' <<<"$out"; then
              echo "$out"
              echo "::error::stack/${stack}/docker-compose.yml interpolates a variable its rendered .env does not set"
              exit 1
            fi
            echo "ok   stack/${stack}/docker-compose.yml"
          done
          rm -rf "${RUNNER_TEMP}/bundle"
