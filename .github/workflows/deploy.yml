name: Deploy

# The ONE deployer. Runs the Ansible playbook: provisions the host, runs the edge proxy +
# Watchtower, and (re)deploys every app stack. Manually triggered — run it on a fresh
# server, or when a stack's compose/secrets change. Routine image updates happen on their
# own via Watchtower, so you rarely click this.
#
# Required repo secrets:
#   SERVER_HOST · SERVER_PASSWORD            shared host IP (the one place it lives) + root SSH pw
#   GHCR_USERNAME · GHCR_TOKEN               GHCR login; token needs read:packages for crm,
#   CRM_APP_KEY · CRM_DB_PASSWORD · CRM_REDIS_PASSWORD · CRM_TYPESENSE_API_KEY · CRM_ADMIN_PASSWORD
#   PRIZM_DB_PASSWORD                        shared by CRM (creates the role) + hypernova (connects)
#   HYPERNOVA_SESSION_SECRET · HYPERNOVA_ADMIN_PASSWORD
# Optional: SERVER_USER (defaults to root). The ACME email is baked, not a secret.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          python -m venv "${RUNNER_TEMP}/ansible-venv"
          "${RUNNER_TEMP}/ansible-venv/bin/pip" install --disable-pip-version-check \
            "ansible-core<2.19" paramiko
          echo "${RUNNER_TEMP}/ansible-venv/bin" >> "${GITHUB_PATH}"

      - name: Build extra-vars file from secrets
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          CRM_APP_KEY: ${{ secrets.CRM_APP_KEY }}
          CRM_DB_PASSWORD: ${{ secrets.CRM_DB_PASSWORD }}
          PRIZM_DB_PASSWORD: ${{ secrets.PRIZM_DB_PASSWORD }}
          CRM_REDIS_PASSWORD: ${{ secrets.CRM_REDIS_PASSWORD }}
          CRM_TYPESENSE_API_KEY: ${{ secrets.CRM_TYPESENSE_API_KEY }}
          CRM_ADMIN_PASSWORD: ${{ secrets.CRM_ADMIN_PASSWORD }}
          HYPERNOVA_SESSION_SECRET: ${{ secrets.HYPERNOVA_SESSION_SECRET }}
          HYPERNOVA_ADMIN_PASSWORD: ${{ secrets.HYPERNOVA_ADMIN_PASSWORD }}
        run: |
          jq -n '{
            ghcr_username: env.GHCR_USERNAME,
            ghcr_token: env.GHCR_TOKEN,
            crm_app_key: env.CRM_APP_KEY,
            crm_db_password: env.CRM_DB_PASSWORD,
            prizm_db_password: env.PRIZM_DB_PASSWORD,
            crm_redis_password: env.CRM_REDIS_PASSWORD,
            crm_typesense_api_key: env.CRM_TYPESENSE_API_KEY,
            crm_admin_password: env.CRM_ADMIN_PASSWORD,
            hypernova_session_secret: env.HYPERNOVA_SESSION_SECRET,
            hypernova_admin_password: env.HYPERNOVA_ADMIN_PASSWORD,
          }' > "${RUNNER_TEMP}/extra-vars.json"

      - name: Run the deploy playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          ansible-playbook -i "${SERVER_HOST}," playbook.yml \
            -e "ansible_connection=paramiko_ssh" \
            -e "ansible_user=${SERVER_USER:-root}" \
            -e "ansible_password=${SERVER_PASSWORD}" \
            -e "ansible_become_password=${SERVER_PASSWORD}" \
            -e "@${RUNNER_TEMP}/extra-vars.json"

      - name: Remove the extra-vars file
        if: always()
        run: rm -f "${RUNNER_TEMP}/extra-vars.json"
