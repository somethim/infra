name: Deploy

# The one deployer. See docs/deploying.md for the secrets and the tag system.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Ansible tags to limit the run. Blank runs everything. `host` applies
          host-level changes only and touches no stack — which is how you prove a change to
          this workflow works without redeploying the sites."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible + jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ansible jq

      - name: Build extra-vars file from secrets
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          POSTGRES_SUPERUSER_PASSWORD: ${{ secrets.POSTGRES_SUPERUSER_PASSWORD }}
          CRM_APP_KEY: ${{ secrets.CRM_APP_KEY }}
          CRM_DB_PASSWORD: ${{ secrets.CRM_DB_PASSWORD }}
          PRIZM_DB_PASSWORD: ${{ secrets.PRIZM_DB_PASSWORD }}
          CRM_REDIS_PASSWORD: ${{ secrets.CRM_REDIS_PASSWORD }}
          CRM_TYPESENSE_API_KEY: ${{ secrets.CRM_TYPESENSE_API_KEY }}
          CRM_ADMIN_PASSWORD: ${{ secrets.CRM_ADMIN_PASSWORD }}
          HYPERNOVA_SESSION_SECRET: ${{ secrets.HYPERNOVA_SESSION_SECRET }}
          HYPERNOVA_ADMIN_PASSWORD: ${{ secrets.HYPERNOVA_ADMIN_PASSWORD }}
          PORTFOLIO_DB_PASSWORD: ${{ secrets.PORTFOLIO_DB_PASSWORD }}
          PORTFOLIO_ADMIN_PASSWORD: ${{ secrets.PORTFOLIO_ADMIN_PASSWORD }}
          PORTFOLIO_RESEND_API_KEY: ${{ secrets.PORTFOLIO_RESEND_API_KEY }}
          PORTFOLIO_TOTP_ENCRYPTION_KEY: ${{ secrets.PORTFOLIO_TOTP_ENCRYPTION_KEY }}
        run: |
          jq -n '{
            ghcr_username: env.GHCR_USERNAME,
            ghcr_token: env.GHCR_TOKEN,
            postgres_superuser_password: env.POSTGRES_SUPERUSER_PASSWORD,
            crm_app_key: env.CRM_APP_KEY,
            crm_db_password: env.CRM_DB_PASSWORD,
            prizm_db_password: env.PRIZM_DB_PASSWORD,
            crm_redis_password: env.CRM_REDIS_PASSWORD,
            crm_typesense_api_key: env.CRM_TYPESENSE_API_KEY,
            crm_admin_password: env.CRM_ADMIN_PASSWORD,
            hypernova_session_secret: env.HYPERNOVA_SESSION_SECRET,
            hypernova_admin_password: env.HYPERNOVA_ADMIN_PASSWORD,
            portfolio_db_password: env.PORTFOLIO_DB_PASSWORD,
            portfolio_admin_password: env.PORTFOLIO_ADMIN_PASSWORD,
            portfolio_resend_api_key: env.PORTFOLIO_RESEND_API_KEY,
            portfolio_totp_encryption_key: env.PORTFOLIO_TOTP_ENCRYPTION_KEY
          }' > "${RUNNER_TEMP}/extra-vars.json"

      - name: Write the deploy key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$SSH_PRIVATE_KEY" > "${RUNNER_TEMP}/deploy_key"
          chmod 600 "${RUNNER_TEMP}/deploy_key"

      - name: Run the deploy playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TAGS: ${{ inputs.tags }}
        run: |
          ansible-playbook -i "${SERVER_HOST}," playbook.yml \
            --private-key "${RUNNER_TEMP}/deploy_key" \
            ${TAGS:+--tags "$TAGS"} \
            -e "ansible_user=${SERVER_USER:-root}" \
            -e "@${RUNNER_TEMP}/extra-vars.json"

      - name: Remove the secrets from the runner
        if: always()
        run: rm -f "${RUNNER_TEMP}/extra-vars.json" "${RUNNER_TEMP}/deploy_key"
