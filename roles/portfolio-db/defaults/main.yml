---
# The shared PostgreSQL container, run by the crm stack and reachable from the
# other stacks over the `data` network.
portfolio_db_container: postgresql
# Its superuser and bootstrap database (crm's POSTGRES_USER / POSTGRES_DB), which
# is the only account that can create a role and a database here.
portfolio_db_superuser: crm
portfolio_db_superuser_database: crm

portfolio_db_role: portfolio
portfolio_db_name: portfolio
