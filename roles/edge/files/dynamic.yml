# Traefik file-provider config, loaded alongside the Docker provider (see
# docker-compose.yml's --providers.file.directory). Anything referenced here
# is addressed elsewhere as name@file, e.g. cloudflare-only@file.
#
# cloudflare-only restricts a router to Cloudflare's edge. It exists because
# stacks/portfolio trusts the Cf-Connecting-Ip header for rate-limit keying
# (CLIENT_IP_SOURCE=Cloudflare, see crates/portfolio/src/server/mod.rs's
# ClientIpSource::CloudflareConnectingIp). Without this, that header is just
# a request header like any other: anyone who finds the origin's real IP can
# connect directly, skip Cloudflare, and set it to whatever they want,
# defeating the rate limiter. See docs/edge.md.
#
# It must come off (or the affected domain's router label removed) if a
# domain is ever un-proxied from Cloudflare (grey-clouded) or the site
# becomes unreachable because of it.
#
# The ranges below are Cloudflare's own published list
# (https://www.cloudflare.com/ips-v4, https://www.cloudflare.com/ips-v6,
# fetched 2026-09-09). They change rarely, but this file is not
# auto-updated — re-fetch and diff periodically.
http:
  middlewares:
    cloudflare-only:
      ipAllowList:
        sourceRange:
          - 173.245.48.0/20
          - 103.21.244.0/22
          - 103.22.200.0/22
          - 103.31.4.0/22
          - 141.101.64.0/18
          - 108.162.192.0/18
          - 190.93.240.0/20
          - 188.114.96.0/20
          - 197.234.240.0/22
          - 198.41.128.0/17
          - 162.158.0.0/15
          - 104.16.0.0/13
          - 104.24.0.0/14
          - 172.64.0.0/13
          - 131.0.72.0/22
          - 2400:cb00::/32
          - 2606:4700::/32
          - 2803:f800::/32
          - 2405:b500::/32
          - 2405:8100::/32
          - 2a06:98c0::/29
          - 2c0f:f248::/32
