---
# See docs/edge.md. The shared networks are created by roles/host. Traefik has
# no certificates, no env file and no file provider: Cloudflare terminates TLS
# and the tunnel (stack/tunnel, a release stack) is its only way in.
- name: Create the edge deploy directory
  ansible.builtin.file:
    path: "{{ edge_deploy_path }}"
    state: directory
    mode: "0755"

- name: Ship the Traefik compose file
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: "{{ edge_deploy_path }}/docker-compose.yml"
    mode: "0644"

- name: Bring up the edge proxy
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ edge_deploy_path }}"
  register: edge_up
  changed_when: "'Started' in edge_up.stderr or 'Created' in edge_up.stderr or 'Recreated' in edge_up.stderr"

- name: Verify Traefik publishes no port and can use the Docker API through its socket proxy
  ansible.builtin.import_tasks: verify.yml
