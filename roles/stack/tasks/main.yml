---
# See docs/architecture.md — What a stack is.
- name: "[{{ stack.name }}] Create deploy directory"
  ansible.builtin.file:
    path: "/opt/{{ stack.name }}"
    state: directory
    mode: "0755"

- name: "[{{ stack.name }}] Run the stack's pre-role"
  ansible.builtin.include_role:
    name: "{{ stack.pre_role }}"
  when: stack.pre_role is defined

- name: "[{{ stack.name }}] Ship docker-compose.yml"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/stacks/{{ stack.name }}/docker-compose.yml"
    dest: "/opt/{{ stack.name }}/docker-compose.yml"
    mode: "0644"

- name: "[{{ stack.name }}] Render .env"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/stacks/{{ stack.name }}/env.j2"
    dest: "/opt/{{ stack.name }}/.env"
    mode: "0600"

- name: "[{{ stack.name }}] Pull images and bring the stack up"
  ansible.builtin.command: docker compose up -d --remove-orphans --pull always
  args:
    chdir: "/opt/{{ stack.name }}"
  register: stack_up
  changed_when: >-
    'Started' in stack_up.stderr or 'Created' in stack_up.stderr
    or 'Recreated' in stack_up.stderr or 'Pulled' in stack_up.stderr

- name: "[{{ stack.name }}] Run the stack's post-role"
  ansible.builtin.include_role:
    name: "{{ stack.post_role }}"
  when: stack.post_role is defined
