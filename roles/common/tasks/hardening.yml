---
# See docs/host.md — SSH, fail2ban, Patching.
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Configure the fail2ban SSH jail
  ansible.builtin.copy:
    src: jail.local
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Reboot for kernel updates in the quiet hours
  ansible.builtin.copy:
    src: 20auto-upgrades-reboot
    dest: /etc/apt/apt.conf.d/20auto-upgrades-reboot
    mode: "0644"

- name: Ensure root's .ssh directory exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Trust the CI deploy key
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    line: "{{ lookup('ansible.builtin.file', role_path + '/files/deploy_key.pub') | trim }}"
    state: present
    create: true
    owner: root
    group: root
    mode: "0600"

- name: Set the SSH password-authentication policy
  ansible.builtin.template:
    src: 10-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
