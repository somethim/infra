---
# Port 22 is open to the internet and the deploy workflow authenticates as root with a
# password, so password auth cannot simply be turned off. fail2ban is the mitigation
# that does not require that cutover: it bans the source after five failures.
#
# It is not the whole answer. Moving CI to an SSH key and then setting
# PasswordAuthentication no is, and that is tracked separately in the README.
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Configure the fail2ban SSH jail
  ansible.builtin.copy:
    src: jail.local
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Reboot for kernel updates in the quiet hours
  ansible.builtin.copy:
    src: 20auto-upgrades-reboot
    dest: /etc/apt/apt.conf.d/20auto-upgrades-reboot
    mode: "0644"

# Present on this host already, but not on a rebuilt one — and `lineinfile` below
# creates a missing file, never a missing parent.
- name: Ensure root's .ssh directory exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"

# The deploy workflow's own key. Public halves are not secret, so this lives in the
# repo: a rebuilt host then trusts CI without anyone remembering to paste anything.
# `lineinfile` rather than the authorized_key module, which lives in a collection this
# repo deliberately does not depend on.
- name: Trust the CI deploy key
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    line: "{{ lookup('ansible.builtin.file', role_path + '/files/deploy_key.pub') | trim }}"
    state: present
    create: true
    owner: root
    group: root
    mode: "0600"

- name: Set the SSH password-authentication policy
  ansible.builtin.template:
    src: 10-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: "0644"
    # A malformed drop-in makes sshd refuse to start, and the reload below would then
    # take the only way in with it.
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
