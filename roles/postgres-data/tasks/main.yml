---
# See docs/database.md — The data volume.
- name: Pull the PostgreSQL image
  ansible.builtin.command:
    argv: [docker, pull, "{{ postgres_image }}"]
  register: postgres_pull
  changed_when: "'Downloaded newer image' in postgres_pull.stdout"

- name: Look for the shared data volume
  ansible.builtin.command:
    argv: [docker, volume, inspect, "{{ postgres_volume }}"]
  register: postgres_volume_state
  failed_when: false
  changed_when: false

- name: Create the shared data volume
  ansible.builtin.command:
    argv: [docker, volume, create, "{{ postgres_volume }}"]
  when: postgres_volume_state.rc != 0
  changed_when: true
