---
# Install Docker Engine + the compose plugin via Docker's official convenience script.
# `creates` makes it idempotent — skipped once docker is present.
- name: Install Docker Engine + compose plugin
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://get.docker.com | sh
    executable: /bin/bash
    creates: /usr/bin/docker

# Without this the json-file driver keeps every line a container has ever written.
# One crash-looping container fills the disk, and PostgreSQL's data directory is on
# the same one. Caps each container at 30 MB (3 x 10 MB).
#
# It applies to containers CREATED after the daemon picks it up — the running ones
# keep their current unbounded logs until they are next recreated, which Watchtower
# does on the next image push.
- name: Configure the Docker daemon (log rotation)
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Reload Docker

- name: Ensure Docker is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

# Every image swap — a Watchtower update, a `compose up --pull always` — leaves the
# replaced image behind untagged. Watchtower cleans up only the swaps it performed
# itself, so a deploy-driven one accumulates until something reclaims it.
- name: Install the image-prune timer
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - docker-prune.service
    - docker-prune.timer

- name: Enable the image-prune timer
  ansible.builtin.systemd:
    name: docker-prune.timer
    enabled: true
    state: started
    daemon_reload: true
