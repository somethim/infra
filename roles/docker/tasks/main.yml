---
# See docs/host.md — The Docker daemon; docs/agents.md — The prune timer.
- name: Install Docker Engine + compose plugin
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://get.docker.com | sh
    executable: /bin/bash
    creates: /usr/bin/docker

- name: Configure the Docker daemon (log rotation)
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Reload Docker

- name: Ensure Docker is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Install the image-prune timer
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - docker-prune.service
    - docker-prune.timer

- name: Enable the image-prune timer
  ansible.builtin.systemd:
    name: docker-prune.timer
    enabled: true
    state: started
    daemon_reload: true
