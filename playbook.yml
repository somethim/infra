# Interim until the release path (plans/004) replaces it; do not run against the live host.
# It only asserts secrets and deploys the stacks; the host is provisioned by provision.yml.
# See docs/architecture.md and docs/deploying.md.
- name: Deploy all stacks (interim)
  hosts: all
  become: true

  vars:
    # Order is load-bearing. See docs/architecture.md — Deploy order.
    stacks:
      - { name: database, pre_role: postgres-data, post_role: postgres-provision }
      - { name: hypernova }
      - { name: portfolio }

    # See docs/database.md.
    postgres_image: postgres:18-alpine
    postgres_container: postgresql
    postgres_volume: pgdata-v18
    postgres_superuser: postgres
    postgres_bootstrap_database: postgres

    postgres_consumers:
      - { name: prizm, password: "{{ prizm_db_password }}" }
      - { name: portfolio, password: "{{ portfolio_db_password }}" }

  pre_tasks:
    - name: Require deploy secrets
      tags: [secrets]
      ansible.builtin.assert:
        that:
          - ghcr_username | default('') | length > 0
          - ghcr_token | default('') | length > 0
          - postgres_superuser_password | default('') | length > 0
          - prizm_db_password | default('') | length > 0
          - hypernova_session_secret | default('') | length > 0
          - hypernova_admin_password | default('') | length > 0
          - portfolio_db_password | default('') | length > 0
          - portfolio_admin_password | default('') | length > 0
          - portfolio_totp_encryption_key | default('') | length > 0
        fail_msg: "Missing one or more required deploy secrets (see docs/deploying.md)."

  tasks:
    - name: Deploy stacks
      tags: [secrets, stacks]
      ansible.builtin.include_role:
        name: stack
      vars:
        stack: "{{ item }}"
      loop: "{{ stacks }}"
      loop_control:
        label: "{{ item.name }}"
