# The one deployer. See docs/architecture.md and docs/deploying.md.
- name: Provision shared host and deploy all stacks
  hosts: all
  become: true

  vars:
    # Order is load-bearing. See docs/architecture.md — Deploy order.
    stacks:
      - { name: database, pre_role: postgres-data, post_role: postgres-provision }
      - { name: crm }
      - { name: hypernova }
      - { name: portfolio }

    # See docs/database.md.
    postgres_image: postgres:18-alpine
    postgres_container: postgresql
    postgres_volume: pgdata-v18
    postgres_legacy_volume: crm-pgdata-v18
    postgres_superuser: postgres
    postgres_bootstrap_database: postgres

    postgres_consumers:
      - { name: crm, password: "{{ crm_db_password }}" }
      - { name: prizm, password: "{{ prizm_db_password }}" }
      - { name: portfolio, password: "{{ portfolio_db_password }}" }

  pre_tasks:
    - name: Require deploy secrets
      tags: [secrets]
      ansible.builtin.assert:
        that:
          - ghcr_username | default('') | length > 0
          - ghcr_token | default('') | length > 0
          - postgres_superuser_password | default('') | length > 0
          - crm_app_key | default('') | length > 0
          - crm_db_password | default('') | length > 0
          - prizm_db_password | default('') | length > 0
          - crm_redis_password | default('') | length > 0
          - crm_typesense_api_key | default('') | length > 0
          - crm_admin_password | default('') | length > 0
          - hypernova_session_secret | default('') | length > 0
          - hypernova_admin_password | default('') | length > 0
          - portfolio_db_password | default('') | length > 0
          - portfolio_admin_password | default('') | length > 0
        fail_msg: "Missing one or more required deploy secrets (see docs/deploying.md)."

  # See docs/deploying.md — Tags.
  roles:
    - role: common
      tags: [host, hardening]
    - role: docker
      tags: [host, docker]
    - role: edge
      tags: [host, edge]
    - role: watchtower
      tags: [secrets, watchtower]
    - role: autoheal
      tags: [host, autoheal]

  tasks:
    - name: Deploy stacks
      tags: [secrets, stacks]
      ansible.builtin.include_role:
        name: stack
      vars:
        stack: "{{ item }}"
      loop: "{{ stacks }}"
      loop_control:
        label: "{{ item.name }}"
