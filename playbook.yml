# The ONE deployer. Provisions the shared host (packages, strict firewall, Docker),
# runs the edge Traefik proxy + shared networks, starts Watchtower, and deploys every app
# stack (crm, hypernova, portfolio). The app repos only BUILD images → GHCR; Watchtower then
# auto-updates the running containers when a new image is pushed.
#
# Run this once per server, and again only when a stack's compose or secrets change
# (image updates happen on their own via Watchtower). Idempotent.
#
#   CI:    ansible-playbook -i "${SERVER_HOST}," playbook.yml -e @extra-vars.json -e ansible_password=...
#   local: cp inventory/hosts.example inventory/hosts && edit, then pass the same -e vars
- name: Provision shared host and deploy all stacks
  hosts: all
  become: true

  vars:
    # App stacks to deploy (files under stacks/<name>/). Add a new project here + drop a
    # stacks/<name>/ dir; nothing else changes.
    stacks:
      - { name: crm, has_initdb: true }
      - { name: hypernova }
      - { name: portfolio, pre_role: portfolio-db }

  pre_tasks:
    # Tagged, so the host-level work below can run on its own without them.
    - name: Require deploy secrets
      tags: [secrets]
      ansible.builtin.assert:
        that:
          - ghcr_username | default('') | length > 0
          - ghcr_token | default('') | length > 0
          - crm_app_key | default('') | length > 0
          - crm_db_password | default('') | length > 0
          - prizm_db_password | default('') | length > 0
          - crm_redis_password | default('') | length > 0
          - crm_typesense_api_key | default('') | length > 0
          - crm_admin_password | default('') | length > 0
          - hypernova_session_secret | default('') | length > 0
          - hypernova_admin_password | default('') | length > 0
          - portfolio_db_password | default('') | length > 0
          - portfolio_admin_password | default('') | length > 0
        fail_msg: "Missing one or more required deploy secrets (see README)."

  # Tags exist for one reason: the host-level roles need no secrets and touch no stack,
  # so `--tags host` is safe to run at a moment when the stacks must NOT be redeployed —
  # for instance while an app's compose file expects an image that is not published yet.
  # No tags at all still runs everything.
  roles:
    # base packages, strict default-deny firewall (22/80/443), fail2ban, reboot policy
    - role: common
      tags: [host, hardening]
    # Docker Engine + compose plugin + daemon log rotation
    - role: docker
      tags: [host, docker]
    # shared edge/data networks + Traefik (80/443, Let's Encrypt HTTP-01)
    - role: edge
      tags: [host, edge]
    # GHCR login + auto-update agent. Needs the GHCR secrets, so it is not `host`.
    - role: watchtower
      tags: [secrets, watchtower]
    # restarts a container that reports unhealthy (opt-in by label)
    - role: autoheal
      tags: [host, autoheal]

  tasks:
    - name: Deploy app stacks
      tags: [secrets, stacks]
      ansible.builtin.include_role:
        name: stack
      vars:
        stack: "{{ item }}"
      loop: "{{ stacks }}"
      loop_control:
        label: "{{ item.name }}"
