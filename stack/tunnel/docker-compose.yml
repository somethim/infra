# The Cloudflare Tunnel: the only way the public reaches this host. See
# docs/edge.md. cloudflared dials out to Cloudflare (no inbound port, no
# published port) and hands each request for a public hostname to Traefik at
# http://edge-traefik:80 on the edge network; the hostnames and that service
# URL are the tunnel's Public Hostnames, set in Cloudflare (remotely managed).
# Its only secret, TUNNEL_TOKEN, comes from tunnel.env, which only this
# container reads; rotating it is a normal release. infra-apply starts this
# stack after hypernova and checks /ready on its metrics port.
name: tunnel

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    container_name: cloudflared
    mem_limit: 128m
    restart: always
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    env_file: tunnel.env
    # The image's entrypoint is `cloudflared --no-autoupdate`; the token comes
    # from TUNNEL_TOKEN. Metrics (and /ready) listen on the edge network only.
    command: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
    healthcheck:
      test: [CMD, cloudflared, tunnel, --metrics, "127.0.0.1:2000", ready]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - edge
    labels:
      - autoheal=true

networks:
  edge:
    name: edge
    external: true
