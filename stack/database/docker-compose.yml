# The shared PostgreSQL. See docs/database.md.
# infra-apply brings this stack up first (--wait), runs provision.sql through
# the local socket, and only then starts portfolio and hypernova.
# Never label the database for Watchtower or autoheal.
name: database

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: postgresql
    restart: always
    security_opt:
      - no-new-privileges:true
    env_file: postgres.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  data:
    name: data
    external: true

volumes:
  pgdata:
    name: pgdata-v18
    external: true
