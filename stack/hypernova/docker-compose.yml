# hypernova (prizm-lodge) stack. See docs/stacks.md.
# .env (images and domain) only feeds interpolation; the provider reads its
# secrets from provider.env, and web has no secrets at all. The provider alone
# also joins llm, the internal network it shares with Ollama (stack/ai) and
# nothing else.
name: hypernova

services:
  provider:
    image: ${PROVIDER_IMAGE}
    container_name: prizm-provider
    mem_limit: 384m
    restart: always
    security_opt:
      - no-new-privileges:true
    env_file: provider.env
    volumes:
      - prizm-storage:/app/storage
    networks:
      - data
      - edge
      - llm
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - autoheal=true
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.hypernova-provider.rule=Host(`${WEB_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.hypernova-provider.priority=100
      - traefik.http.routers.hypernova-provider.entrypoints=web
      - traefik.http.middlewares.hypernova-stripapi.stripprefix.prefixes=/api
      - traefik.http.routers.hypernova-provider.middlewares=hypernova-stripapi
      - traefik.http.services.hypernova-provider.loadbalancer.server.port=8080

  web:
    image: ${WEB_IMAGE}
    container_name: prizm-web
    mem_limit: 512m
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      DO_NOT_TRACK: "1"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    depends_on:
      provider:
        condition: service_healthy
    networks:
      - edge
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.hypernova-web.rule=Host(`${WEB_DOMAIN}`)
      - traefik.http.routers.hypernova-web.priority=1
      - traefik.http.routers.hypernova-web.entrypoints=web
      - traefik.http.services.hypernova-web.loadbalancer.server.port=3000

networks:
  edge:
    name: edge
    external: true
  data:
    name: data
    external: true
  llm:
    name: llm
    external: true

volumes:
  prizm-storage:
