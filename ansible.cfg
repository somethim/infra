# Auto-loaded when ansible runs from this directory. The host is NOT committed here —
# CI passes it as an inline inventory: `ansible-playbook -i "${SERVER_HOST}," playbook.yml`.
# Authentication is by SSH key: CI passes `--private-key` from the SSH_PRIVATE_KEY
# secret, and a local run uses whichever of your keys the host already trusts.
[defaults]
host_key_checking = False
retry_files_enabled = False
roles_path = roles
inventory = inventory/hosts
