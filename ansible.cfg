# Auto-loaded when ansible runs from this directory. The host is NOT committed here —
# CI passes it as an inline inventory: `ansible-playbook -i "${SERVER_HOST}," playbook.yml`.
# SSH password is supplied at runtime via `-e ansible_password=...` (CI secret), so
# sshpass is required on the controller (the workflow installs it).
[defaults]
host_key_checking = False
retry_files_enabled = False
roles_path = roles
inventory = inventory/hosts
